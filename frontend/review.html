<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Review our picnic</title><link rel="stylesheet" href="styles.css"><script src="review.js" defer></script></head>
<body class="review-page"><main class="review-main"><a class="brand" href="/">◒ Picnic Planner</a><h1>Let’s plan a great day together.</h1><p>Take a look and tell the group what you think.</p><div id="review-status" role="status">Loading the picnic…</div><div id="shared-content" hidden></div><section id="feedback-section" class="panel" hidden><h2>What do you think?</h2><form id="review-form"><label for="review-name">Your name</label><input id="review-name" maxlength="100" required autocomplete="name"><label for="review-response">Your response</label><select id="review-response"><option>Looks good</option><option>Suggest a change</option><option>Cannot make it</option></select><label for="review-comment">Comment (optional)</label><textarea id="review-comment" maxlength="2000" rows="3" placeholder="Any ideas or changes?"></textarea><button class="primary" id="send-review">Send feedback</button><p class="form-note">Your name and feedback are visible to everyone with this link.</p><p id="feedback-status" role="status"></p></form></section><section id="responses-section" class="panel" hidden><div class="responses-heading"><h2>Group feedback</h2><button class="secondary" id="refresh-reviews">Refresh</button></div><div id="reviews"></div></section><p class="form-note">Shared snapshot · Changes to the original plan need a new link.</p></main></body></html>
